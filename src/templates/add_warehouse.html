{% extends "base.html" %}

{% block title %}Add Warehouse - Warehouse Management{% endblock %}

{% block content %}
<h2>Add New Warehouse</h2>

<form method="POST">
    <div class="form-group">
        <label for="name">Warehouse Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter warehouse name">
    </div>
    <div class="form-group">
        <label for="capacity">Maximum Capacity</label>
        <input type="number" id="capacity" name="capacity" step="0.01" min="0.01" required placeholder="Enter maximum capacity">
    </div>
    <div class="actions">
        <button type="submit" class="btn btn-success">Add Warehouse</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
